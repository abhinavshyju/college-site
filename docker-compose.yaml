version: "3.8"
services:
  cms-db:
    container_name: container-cms-pg
    image: postgres
    hostname: localhost
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: cadmin
      POSTGRES_PASSWORD: cpassword
      POSTGRES_DB: cms_db
    volumes:
      - cms-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  cms-pgadmin:
    container_name: container-cms-pgadmin
    image: dpage/pgadmin4
    depends_on:
      - cms-db
    ports:
      - "5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cms.com
      PGADMIN_DEFAULT_PASSWORD: root
    restart: unless-stopped

volumes:
  cms-postgres-data:
